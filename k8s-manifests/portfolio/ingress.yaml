apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # CKS Security: Enable TLS and restrict CORS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Restrict CORS to specific domains instead of wildcard
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://portfolio.local,https://localhost:3000"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - portfolio.local
    secretName: portfolio-tls
  rules:
  - host: portfolio.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      - path: /avatar
        pathType: Prefix
        backend:
          service:
            name: avatar-creation
            port:
              number: 8000
      - path: /rag
        pathType: Prefix
        backend:
          service:
            name: rag-pipeline
            port:
              number: 8000
      - path: /jupyter
        pathType: Prefix
        backend:
          service:
            name: rag-pipeline
            port:
              number: 8888
---
# LoadBalancer service for local development access
apiVersion: v1
kind: Service
metadata:
  name: portfolio-loadbalancer
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ui
  ports:
  - port: 80
    targetPort: 80
    name: http