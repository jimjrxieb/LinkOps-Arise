# SECURITY: Secrets should be managed via External Secrets Operator or Azure Key Vault
# This file is kept as template only - actual secrets managed externally
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: secret
  annotations:
    external-secrets.io/managed-by: external-secrets-operator
type: Opaque
# data: {} # Managed by External Secrets Operator
stringData:
  # Template for External Secrets Operator
  # Actual values populated from Azure Key Vault
  OPENAI_API_KEY: ""  # Managed by External Secrets
  DATABASE_PASSWORD: ""  # Managed by External Secrets