# CKS Network Policies: Micro-segmentation for Portfolio Application

# Default deny all ingress and egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: portfolio
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: security
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: portfolio
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: dns
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# UI service network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-network-policy
  namespace: portfolio
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: frontend
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ui
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
  # Allow traffic from monitoring (for health checks)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow calls to API service
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: api
    ports:
    - protocol: TCP
      port: 8000
---
# API service network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: portfolio
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from UI
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ui
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from ingress controller (direct API access)
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow monitoring traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow calls to ChromaDB
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: chromadb
    ports:
    - protocol: TCP
      port: 8000
  # Allow calls to Avatar service
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: avatar-creation
    ports:
    - protocol: TCP
      port: 8000
  # Allow calls to RAG pipeline
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rag-pipeline
    ports:
    - protocol: TCP
      port: 8000
  # Allow HTTPS egress for external APIs (OpenAI)
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# ChromaDB network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chromadb-network-policy
  namespace: portfolio
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/component: database
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chromadb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow traffic from API service and RAG pipeline
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: api
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rag-pipeline
    ports:
    - protocol: TCP
      port: 8000
  # Allow monitoring traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS only
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Avatar Creation service network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: avatar-creation-network-policy
  namespace: portfolio
  labels:
    app.kubernetes.io/name: avatar-creation
    app.kubernetes.io/component: ai-service
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: avatar-creation
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from API service and ingress
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: api
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow monitoring traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS for external AI APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# RAG Pipeline service network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-pipeline-network-policy
  namespace: portfolio
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: ai-service
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-pipeline
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow API traffic
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: api
    ports:
    - protocol: TCP
      port: 8000
  # Allow ingress for direct RAG access
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow Jupyter access (port 8888)
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8888
  # Allow monitoring traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8888
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow calls to ChromaDB
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: chromadb
    ports:
    - protocol: TCP
      port: 8000
  # Allow HTTPS for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Cross-namespace policy: Allow monitoring access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-access
  namespace: portfolio
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: monitoring
    cks-domain: "minimize-microservice-vulnerabilities"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # Allow Prometheus scraping
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  # Allow Grafana access for dashboards
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana