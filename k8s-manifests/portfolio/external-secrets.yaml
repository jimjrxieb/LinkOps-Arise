# CKS Security: External Secrets Operator configuration for Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://linkops-keyvault.vault.azure.net/"
      identityId: ""  # Will be populated by Terraform
---
# External Secret that pulls from Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: portfolio-external-secrets
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: portfolio-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        OPENAI_API_KEY: "{{ .openai_api_key | toString }}"
        DATABASE_PASSWORD: "{{ .database_password | toString }}"
        JUPYTER_TOKEN: "{{ .jupyter_token | toString }}"
  data:
  - secretKey: openai_api_key
    remoteRef:
      key: openai-api-key
  - secretKey: database_password
    remoteRef:
      key: portfolio-database-password
  - secretKey: jupyter_token
    remoteRef:
      key: jupyter-access-token
---
# CKS Security: Pod Security Standards enforcement
apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
  labels:
    # Pod Security Standards
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Standard labels
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/managed-by: terraform
    # Network policy isolation
    networking/namespace: portfolio