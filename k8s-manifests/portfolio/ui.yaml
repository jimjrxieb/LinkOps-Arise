apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: portfolio
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      containers:
      - name: ui
        image: ghcr.io/jimjrxieb/portfolio-ui:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: portfolio-config
              key: API_URL
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: portfolio
  labels:
    app.kubernetes.io/name: ui
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP