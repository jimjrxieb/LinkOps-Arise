apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: portfolio
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # CKS Security: Pod security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ghcr.io/jimjrxieb/portfolio-api:latest
        # CKS Security: Container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: CHROMADB_URL
          valueFrom:
            configMapKeyRef:
              name: portfolio-config
              key: CHROMADB_URL
        - name: AVATAR_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: portfolio-config
              key: AVATAR_SERVICE_URL
        - name: RAG_API_URL
          valueFrom:
            configMapKeyRef:
              name: portfolio-config
              key: RAG_API_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: portfolio-secrets
              key: OPENAI_API_KEY
        volumeMounts:
        - name: api-data
          mountPath: /app/data
        - name: tmp-volume
          mountPath: /tmp
        - name: var-tmp-volume
          mountPath: /var/tmp
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: api-data
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      - name: var-tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: portfolio
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
  - port: 8000
    targetPort: 8000
    name: http