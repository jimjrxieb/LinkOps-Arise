# CKS Policy: Disallow Privileged Containers
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowprivileged
  labels:
    cks-domain: "cluster-hardening"
    policy-type: "container-security"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowPrivileged
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowprivileged

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged
          msg := sprintf("Privileged container '%v' is not allowed", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          container.securityContext.privileged
          msg := sprintf("Privileged init container '%v' is not allowed", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.object.spec.securityContext.privileged
          msg := "Privileged pod security context is not allowed"
        }
---
apiVersion: config.gatekeeper.sh/v1alpha1
kind: K8sDisallowPrivileged
metadata:
  name: no-privileged-containers
  labels:
    cks-enforcement: "strict"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - "kube-system"
      - "falco-system"  # Falco needs privileged access
---
# CKS Policy: Disallow Host Namespaces
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowhostnamespace
  labels:
    cks-domain: "cluster-hardening"
    policy-type: "host-security"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowHostNamespace
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowhostnamespace

        violation[{"msg": msg}] {
          input.review.object.spec.hostPID
          msg := "Pod cannot use host PID namespace"
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostIPC
          msg := "Pod cannot use host IPC namespace"
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostNetwork
          msg := "Pod cannot use host network namespace"
        }
---
apiVersion: config.gatekeeper.sh/v1alpha1
kind: K8sDisallowHostNamespace
metadata:
  name: no-host-namespace
  labels:
    cks-enforcement: "strict"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - "kube-system"
      - "falco-system"