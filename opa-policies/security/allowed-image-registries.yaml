# CKS Policy: Allowed Image Registries (Supply Chain Security)
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
  labels:
    cks-domain: "supply-chain-security"
    policy-type: "image-security"
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        properties:
          repos:
            type: array
            items:
              type: string
            description: "List of allowed image repositories"
          exemptImages:
            type: array
            items:
              type: string
            description: "List of exempt images that bypass this policy"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          satisfied := [good | repo = input.parameters.repos[_] ; good = startswith(container.image, repo)]
          not any(satisfied)
          not is_exempt(container.image)
          msg := sprintf("Container '%v' has an invalid image repo '%v', allowed repos are %v", [container.name, container.image, input.parameters.repos])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          satisfied := [good | repo = input.parameters.repos[_] ; good = startswith(container.image, repo)]
          not any(satisfied)
          not is_exempt(container.image)
          msg := sprintf("Init container '%v' has an invalid image repo '%v', allowed repos are %v", [container.name, container.image, input.parameters.repos])
        }

        is_exempt(image) {
          exempt_images := input.parameters.exemptImages
          exempt_images[_] == image
        }
---
apiVersion: config.gatekeeper.sh/v1alpha1
kind: K8sAllowedRepos
metadata:
  name: allowed-image-repos
  labels:
    cks-enforcement: "supply-chain"
spec:
  enforcementAction: warn  # Start with warn, then move to deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - "kube-system"
      - "gatekeeper-system"
      - "falco-system"
      - "cert-manager"
      - "external-secrets-system"
  parameters:
    repos:
      - "ghcr.io/jimjrxieb/"  # Your portfolio images
      - "docker.io/library/"  # Official Docker images
      - "quay.io/"           # Red Hat Quay
      - "gcr.io/google-containers/"  # Google container registry
      - "k8s.gcr.io/"        # Kubernetes official images
      - "registry.k8s.io/"   # New Kubernetes registry
    exemptImages:
      - "falcosecurity/falco:latest"  # Falco security tool
---
# CKS Policy: Disallow Latest Tag
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
  labels:
    cks-domain: "supply-chain-security"
    policy-type: "image-tag-security"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Container '%v' uses 'latest' tag which is not allowed", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not contains(container.image, ":")
          msg := sprintf("Container '%v' does not specify a tag (defaults to latest)", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Init container '%v' uses 'latest' tag which is not allowed", [container.name])
        }
---
apiVersion: config.gatekeeper.sh/v1alpha1
kind: K8sDisallowLatestTag
metadata:
  name: no-latest-tag
  labels:
    cks-enforcement: "supply-chain"
spec:
  enforcementAction: warn
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - "kube-system"
      - "gatekeeper-system"