apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: portfolio
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chromadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromadb
    spec:
      containers:
      - name: chromadb
        image: ghcr.io/jimjrxieb/portfolio-chromadb:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: CHROMA_DB_IMPL
          valueFrom:
            configMapKeyRef:
              name: portfolio-config
              key: CHROMA_DB_IMPL
        - name: CHROMA_PERSIST_DIRECTORY
          valueFrom:
            configMapKeyRef:
              name: portfolio-config
              key: CHROMA_PERSIST_DIRECTORY
        volumeMounts:
        - name: chroma-data
          mountPath: /chroma/data
        livenessProbe:
          httpGet:
            path: /api/v1/heartbeat
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/heartbeat
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: chroma-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: portfolio
  labels:
    app.kubernetes.io/name: chromadb
spec:
  selector:
    app.kubernetes.io/name: chromadb
  ports:
  - port: 8000
    targetPort: 8000
    name: http